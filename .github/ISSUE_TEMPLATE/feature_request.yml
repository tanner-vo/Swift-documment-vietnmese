name: Đề xuất tính năng
description: Đề xuất cải tiến có lợi cho người học hoặc maintainer.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Nhu cầu người dùng/maintainer
      description: Ai gặp vấn đề gì? Tránh bắt đầu bằng giải pháp.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Giải pháp đề xuất
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Phương án khác đã cân nhắc

  - type: textarea
    id: impact
    attributes:
      label: Ảnh hưởng
      description: Nêu tác động tới accessibility, security, data, license hoặc maintenance.

  - type: checkboxes
    id: checks
    attributes:
      label: Xác nhận
      options:
        - label: Tôi đã tìm issue/roadmap tương tự.
          required: true
